name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  DOCKER_IMAGE_NAME: fluxgate

jobs:
  # -----------------------------------------------
  # Backend: types, unit and integration tests with coverage thresholds, build
  # -----------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests (no services)
        run: pnpm test

      - name: Start Postgres and Redis
        run: docker compose up -d --wait postgres redis

      - name: Integration tests with coverage (real Postgres and Redis)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Build
        run: pnpm build

  # -----------------------------------------------
  # End to end: gateway, Kafka, Python consumer, alert, webhook, as real processes
  # -----------------------------------------------
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pip install -r ai-service/requirements.txt

      - name: Start Postgres, Redis and Redpanda
        run: docker compose up -d --wait postgres redis redpanda

      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          PYTHON_BIN: python

  # -----------------------------------------------
  # Frontend: lint and build
  # -----------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Build
        run: pnpm --filter frontend build

  # -----------------------------------------------
  # AI service: pytest against the shipped model
  # -----------------------------------------------
  ai-service:
    name: AI Service
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # train.py and evaluate.py are scripts that no test imports.
      - name: Check all modules compile
        run: python -m compileall -q .

      - name: Run tests with coverage
        run: python -m pytest --cov=. --cov-report=term-missing

  # -----------------------------------------------
  # Docker: build and validate the gateway image
  # -----------------------------------------------
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate image
        run: |
          echo "Verifying container runs as non-root user..."
          CONTAINER_USER=$(docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:ci whoami)
          if [ "$CONTAINER_USER" != "fluxgate" ]; then
            echo "::error::Container running as '$CONTAINER_USER' instead of 'fluxgate'"
            exit 1
          fi
          echo "✓ Container runs as: $CONTAINER_USER"

          echo "Verifying Node.js version..."
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:ci node --version

          echo "Verifying build output..."
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:ci ls -la dist/server.js

          echo "✓ Docker validation passed"
