name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DOCKER_IMAGE_NAME: fluxgate

jobs:
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: echo "No linter configured — skipping."

      - name: Run Unit & Integration Tests
        run: pnpm vitest run
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/testdb"
          NODE_ENV: "test"

      - name: Build
        run: pnpm build

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:ci \
            .

      - name: Validate Docker image
        run: |
          echo "Verifying running user is fluxgate..."
          CONTAINER_USER=$(docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:ci whoami)
          if [ "$CONTAINER_USER" != "fluxgate" ]; then
            echo "::error::Container running as '$CONTAINER_USER' instead of 'fluxgate'"
            exit 1
          fi
          echo "Container runs as non-root user: $CONTAINER_USER"

          echo "Verifying node version..."
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:ci node --version

          echo "Verifying build output exists..."
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:ci ls -la dist/server.js

          echo "Docker validation complete"