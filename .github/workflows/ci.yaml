name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DOCKER_IMAGE_NAME: fluxgate

jobs:
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Setup pnpm
      # ------------------------------------------------------------------
      # pnpm/action-setup auto-detects version from packageManager field.
      # Falls back to latest if not specified.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # ------------------------------------------------------------------
      # 3. Setup Node.js with pnpm dependency cache
      # ------------------------------------------------------------------
      # actions/setup-node caches the pnpm store directory, so subsequent
      # runs skip downloading packages that haven't changed.
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # ------------------------------------------------------------------
      # 4. Install dependencies
      # ------------------------------------------------------------------
      # --frozen-lockfile ensures CI fails if lockfile is out of sync with
      # package.json. This catches "works on my machine" issues where a
      # developer forgot to commit an updated lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------
      # 5. Type check (TypeScript)
      # ------------------------------------------------------------------
      # --noEmit validates types without producing output files.
      # This catches type errors that wouldn't surface until runtime.
      - name: Type check
        run: pnpm exec tsc --noEmit

      # ------------------------------------------------------------------
      # 6. Lint (placeholder)
      # ------------------------------------------------------------------
      # No linter is currently configured (no ESLint, Biome, or oxlint).
      # When you add one, replace the echo with the lint command.
      # Example: pnpm exec eslint . --max-warnings=0
      - name: Lint
        run: echo "No linter configured — skipping. Add ESLint or Biome to enable."

      # ------------------------------------------------------------------
      # 7. Test (placeholder)
      # ------------------------------------------------------------------
      # No test runner is currently configured (no vitest, jest, or mocha).
      # The only test file is a k6 load test which requires infrastructure.
      # When you add a test runner, replace the echo with the test command.
      # Example: pnpm exec vitest run
      - name: Test
        run: echo "No test runner configured — skipping. Add Vitest or Jest to enable."

      # ------------------------------------------------------------------
      # 8. Build project
      # ------------------------------------------------------------------
      # Compiles TypeScript to JavaScript. Validates that the full build
      # pipeline succeeds (not just type checking).
      - name: Build
        run: pnpm build

      - name: Build Project
        run: pnpm run build

      - name: Run Unit & Integration Tests
        run: pnpm vitest run
      # ------------------------------------------------------------------
      # 9. Build Docker image
      # ------------------------------------------------------------------
      # Validates the Dockerfile produces a valid image. Tags with the
      # commit SHA for traceability.
      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:ci \
            .

      # ------------------------------------------------------------------
      # 10. Validate Docker image
      # ------------------------------------------------------------------
      # Smoke test: start the container and verify the health endpoint
      # responds. Uses a mock DATABASE_URL since we don't have a real DB
      # in CI — the container should at least start and bind the port.
      # If your app crashes without a real DB connection, this will catch
      # startup errors unrelated to external services.
      - name: Validate Docker image
        run: |
          # Verify container runs as non-root user 'fluxgate'
          echo "Verifying running user is fluxgate..."
          CONTAINER_USER=$(docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:ci whoami)
          if [ "$CONTAINER_USER" != "fluxgate" ]; then
            echo "::error::Container running as '$CONTAINER_USER' instead of 'fluxgate'"
            exit 1
          fi
          echo "Container runs as non-root user: $CONTAINER_USER"

          # Verify node executes successfully inside the container
          echo "Verifying node version..."
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:ci node --version

          # Verify build artifacts (dist/server.js) exist in the container
          echo "Verifying build output exists..."
          docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:ci ls -la dist/server.js

          echo "Docker validation complete"
